
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,900;1,9..144,300&family=JetBrains+Mono:wght@300;400&display=swap');

  #pl-root {
    position: relative;
    width: 100%;
    height: 440px;
    background: #0a0a0f;
    overflow: hidden;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
  }

  .pl-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(232,93,4,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,93,4,0.07) 1px, transparent 1px);
    background-size: 48px 48px;
    animation: gp 3s ease-in-out infinite;
  }
  @keyframes gp { 0%,100%{opacity:.4} 50%{opacity:1} }

  .pl-glow {
    position: absolute;
    width: 480px; height: 480px;
    left: 50%; top: 50%;
    transform: translate(-50%,-50%);
    background: radial-gradient(circle, rgba(232,93,4,0.13) 0%, rgba(29,78,216,0.08) 45%, transparent 70%);
    animation: glw 2s ease-in-out infinite alternate;
  }
  @keyframes glw { from{transform:translate(-50%,-50%) scale(.88);opacity:.6} to{transform:translate(-50%,-50%) scale(1.08);opacity:1} }

  .pl-scan {
    position: absolute; left:0; right:0; height:1px;
    background: linear-gradient(90deg, transparent, rgba(232,93,4,0.5), transparent);
    top: 0;
    animation: scan 2s ease-in-out .5s infinite;
  }
  @keyframes scan { 0%{top:0;opacity:0} 5%{opacity:1} 95%{opacity:.4} 100%{top:100%;opacity:0} }

  .pl-bracket {
    position: absolute;
    width: 36px; height: 36px;
    opacity: 0;
    animation: brin .5s cubic-bezier(.22,1,.36,1) forwards;
  }
  .pl-tl { top:20px;left:20px; border-top:2px solid #e85d04; border-left:2px solid #e85d04; animation-delay:.1s }
  .pl-tr { top:20px;right:20px; border-top:2px solid #e85d04; border-right:2px solid #e85d04; animation-delay:.15s }
  .pl-bl { bottom:20px;left:20px; border-bottom:2px solid #e85d04; border-left:2px solid #e85d04; animation-delay:.2s }
  .pl-br { bottom:20px;right:20px; border-bottom:2px solid #e85d04; border-right:2px solid #e85d04; animation-delay:.25s }
  @keyframes brin { from{opacity:0;transform:scale(.4)} to{opacity:1;transform:scale(1)} }

  .pl-cs {
    position: absolute;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.58rem;
    color: rgba(232,93,4,0.32);
    letter-spacing: .04em;
    line-height: 1.9;
    opacity: 0;
    animation: fadeU .6s ease forwards;
    white-space: nowrap;
    user-select: none;
  }
  .pl-cs-tl { top:68px;left:28px;animation-delay:.4s }
  .pl-cs-br { bottom:68px;right:28px;text-align:right;animation-delay:.6s }
  @keyframes fadeU { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

  .pl-center {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .pl-orbit {
    position: relative;
    width: 150px; height: 150px;
    margin-bottom: 24px;
  }

  .pl-orbit-svg {
    position: absolute; inset: 0;
    animation: spin 3s linear infinite;
  }
  .pl-orbit-svg2 {
    position: absolute; inset: 8px;
    animation: spin 2s linear infinite reverse;
    opacity: .5;
  }
  @keyframes spin { to{transform:rotate(360deg)} }

  .pl-mono {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .pl-kg {
    font-family: 'Fraunces', serif;
    font-size: 2.8rem;
    font-weight: 900;
    color: #f7f5f0;
    letter-spacing: -.06em;
    line-height: 1;
    opacity: 0;
    animation: fadeU .6s cubic-bezier(.22,1,.36,1) .3s forwards;
  }
  .pl-kg em { font-style:italic; color:#e85d04; font-weight:300 }

  .pl-name {
    font-family: 'Fraunces', serif;
    font-size: 2.2rem;
    font-weight: 900;
    color: #f7f5f0;
    letter-spacing: -.04em;
    line-height: 1;
    opacity: 0;
    transform: translateY(16px);
    animation: fadeU .7s cubic-bezier(.22,1,.36,1) .5s forwards;
    text-align: center;
  }
  .pl-name .ital { font-style:italic; color:#e85d04; font-weight:300 }

  .pl-role {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: rgba(247,245,240,.45);
    letter-spacing: .18em;
    text-transform: uppercase;
    margin-top: .5rem;
    opacity: 0;
    animation: fadeU .6s ease .75s forwards;
  }

  .pl-prog-wrap {
    margin-top: 2rem;
    width: 260px;
    display: flex;
    flex-direction: column;
    gap: .4rem;
    align-items: center;
    opacity: 0;
    animation: fadeU .5s ease 1s forwards;
  }
  .pl-track {
    width: 100%; height: 2px;
    background: rgba(247,245,240,.1);
    border-radius: 100px;
    overflow: hidden;
    position: relative;
  }
  .pl-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #e85d04, #1d4ed8);
    border-radius: 100px;
    animation: pfill 2s cubic-bezier(.4,0,.2,1) 1s forwards;
    position: relative;
  }
  .pl-fill::after {
    content:'';
    position: absolute; right:0; top:50%;
    transform: translateY(-50%);
    width:5px; height:5px; border-radius:50%;
    background:#fff;
    box-shadow: 0 0 6px rgba(232,93,4,.9);
  }
  @keyframes pfill { 0%{width:0%} 30%{width:35%} 70%{width:75%} 100%{width:100%} }

  .pl-lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: .58rem;
    color: rgba(247,245,240,.4);
    letter-spacing: .1em;
  }

  .pl-dots {
    display:flex; gap:5px; margin-top:1.2rem;
    opacity:0; animation: fadeU .4s ease 1.1s forwards;
  }
  .pl-dot {
    width:4px; height:4px; border-radius:50%;
    background: rgba(247,245,240,.2);
  }
  .pl-dot.on { background:#e85d04; animation: dp 1.5s ease 1.5s infinite; }
  .pl-dot:nth-child(2){animation-delay:1.6s!important}
  .pl-dot:nth-child(3){animation-delay:1.7s!important}
  @keyframes dp { 0%,100%{opacity:.3;transform:scale(1)} 50%{opacity:1;transform:scale(1.5)} }

  .pl-particles { position:absolute;inset:0;pointer-events:none;overflow:hidden }
  .pl-p {
    position:absolute; border-radius:50%; opacity:0;
    animation: pf linear infinite;
  }
  @keyframes pf {
    0%{transform:translateY(110%) translateX(0) scale(0);opacity:0}
    10%{opacity:.6;transform:translateY(85%) translateX(var(--dx)) scale(1)}
    90%{opacity:.25}
    100%{transform:translateY(-10%) translateX(calc(var(--dx)*3)) scale(.4);opacity:0}
  }

  /* replay button */
  #pl-replay {
    position:absolute; bottom:14px; right:14px;
    font-family:'JetBrains Mono',monospace;
    font-size:.6rem; color:rgba(232,93,4,.5);
    background:none; border:1px solid rgba(232,93,4,.2);
    border-radius:6px; padding:.3rem .7rem; cursor:pointer;
    letter-spacing:.08em; transition:all .2s; z-index:20;
  }
  #pl-replay:hover { color:#e85d04; border-color:rgba(232,93,4,.5); }
</style>

<div id="pl-root">
  <div class="pl-grid"></div>
  <div class="pl-glow"></div>
  <div class="pl-scan"></div>

  <div class="pl-bracket pl-tl"></div>
  <div class="pl-bracket pl-tr"></div>
  <div class="pl-bracket pl-bl"></div>
  <div class="pl-bracket pl-br"></div>

  <div class="pl-cs pl-cs-tl">
    &lt;java&gt;<br>
    class Khuslal {<br>
    &nbsp;&nbsp;String role = "dev";
  </div>
  <div class="pl-cs pl-cs-br">
    @Override<br>
    build(future);<br>
    &lt;/java&gt;
  </div>

  <div class="pl-particles" id="plp"></div>

  <div class="pl-center">
    <div class="pl-orbit">
      <svg class="pl-orbit-svg" viewBox="0 0 150 150" fill="none">
        <circle cx="75" cy="75" r="71" stroke="rgba(232,93,4,0.22)" stroke-width="1" stroke-dasharray="5 4"/>
        <circle cx="146" cy="75" r="4" fill="#e85d04" opacity=".9"/>
        <circle cx="146" cy="75" r="8" fill="#e85d04" opacity=".18"/>
        <line x1="75" y1="4" x2="75" y2="11" stroke="rgba(232,93,4,.5)" stroke-width="1.5"/>
        <line x1="75" y1="139" x2="75" y2="146" stroke="rgba(232,93,4,.5)" stroke-width="1.5"/>
        <line x1="4" y1="75" x2="11" y2="75" stroke="rgba(232,93,4,.5)" stroke-width="1.5"/>
        <line x1="139" y1="75" x2="146" y2="75" stroke="rgba(232,93,4,.5)" stroke-width="1.5"/>
      </svg>
      <svg class="pl-orbit-svg2" viewBox="0 0 134 134" fill="none">
        <circle cx="67" cy="67" r="63" stroke="rgba(29,78,216,0.3)" stroke-width="1" stroke-dasharray="2 7"/>
        <circle cx="130" cy="67" r="3" fill="#1d4ed8" opacity=".8"/>
      </svg>
      <div class="pl-mono">
        <span class="pl-kg">K<em>G</em></span>
      </div>
    </div>

    <div class="pl-name">Khuslal <span class="ital">Gupta</span></div>
    <div class="pl-role">Java Developer · Nepal</div>

    <div class="pl-prog-wrap">
      <div class="pl-track">
        <div class="pl-fill" id="plFill"></div>
      </div>
      <div class="pl-lbl" id="plLbl">Initializing...</div>
    </div>

    <div class="pl-dots">
      <div class="pl-dot on"></div>
      <div class="pl-dot on"></div>
      <div class="pl-dot on"></div>
      <div class="pl-dot"></div>
      <div class="pl-dot"></div>
    </div>
  </div>

  <button id="pl-replay">↺ replay</button>
</div>

<script>
(function() {
  const colors = ['#e85d04','#1d4ed8','#059669','#f59e0b'];
  const pc = document.getElementById('plp');

  function spawnParticles() {
    pc.innerHTML = '';
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.className = 'pl-p';
      const sz = Math.random() * 3.5 + 1.5;
      const col = colors[Math.floor(Math.random() * colors.length)];
      const dx = (Math.random() - 0.5) * 100;
      const dur = Math.random() * 3.5 + 2.5;
      const del = Math.random() * 2.5;
      p.style.cssText = `width:${sz}px;height:${sz}px;background:${col};left:${Math.random()*100}%;--dx:${dx}px;animation-duration:${dur}s;animation-delay:${del}s;`;
      pc.appendChild(p);
    }
  }

  function cycleLabels() {
    const labels = ['Initializing...','Loading assets...','Building UI...','Almost ready...','Welcome ✦'];
    const el = document.getElementById('plLbl');
    let i = 0;
    return setInterval(() => {
      i++;
      if (i < labels.length) {
        el.style.opacity = '0';
        setTimeout(() => { el.textContent = labels[i]; el.style.transition='opacity .25s'; el.style.opacity='1'; }, 200);
      }
    }, 500);
  }

  spawnParticles();
  let timer = cycleLabels();

  document.getElementById('pl-replay').addEventListener('click', () => {
    clearInterval(timer);
    const root = document.getElementById('pl-root');
    const clone = root.cloneNode(true);
    root.replaceWith(clone);
    spawnParticles();
    timer = cycleLabels();
    clone.querySelector('#pl-replay').addEventListener('click', arguments.callee);
  });
})();
</script>
